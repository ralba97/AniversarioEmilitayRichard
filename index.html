<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@latest/dist/driver.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <button id="toggleDarkMode" class="floating-button">
            <i class="ri-sun-line"></i>
        </button>
        <h1 class="titulo-sesion">¡💜 Corazón, llene este formulario mágico 💜!</h1>
        <br>

        <form id="loginForm">
            <div class="form-group">
                <label for="favoriteColor">🎨 ¿De qué color le brillan los ojitos?</label>
                <input type="text" id="favoriteColor" placeholder="Pista: ese que siempre combinas con todo 😉"
                >
            </div>

            <div class="form-group">
                <label for="hobby">📚 ¿Qué actividad le gusta más relizar?</label>
                <input type="text" id="hobby" placeholder="Pista: lo haces con un libro en la mano 💜" >
            </div>

            <div class="form-group">
                <label for="anniversaryDate">📅 ¿Cuándo comenzó esta historia tan bonita?</label>
                <input type="date" id="anniversaryDate" >
            </div>

            <div class="form-group">
                <label for="place">🌄 ¿A dónde solíamos ir cuando recién nos conocimos?</label>
                <input type="text" id="place" placeholder="Pista: caminábamos cerquita del agua 💧" >
            </div>

            <div class="form-group">
                <label for="name">💬 ¿Cómo le digo cuando me derrite?</label>
                <input type="text" id="name" placeholder="Pista: empieza con 'Mi a...'" >
            </div>

            <button type="submit">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" color="#ffffff"
                    fill="none">
                    <path
                        d="M11 3L10.3374 3.23384C7.75867 4.144 6.46928 4.59908 5.73464 5.63742C5 6.67576 5 8.0431 5 10.7778V13.2222C5 15.9569 5 17.3242 5.73464 18.3626C6.46928 19.4009 7.75867 19.856 10.3374 20.7662L11 21"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    <path
                        d="M21 12L11 12M21 12C21 11.2998 19.0057 9.99153 18.5 9.5M21 12C21 12.7002 19.0057 14.0085 18.5 14.5"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg> Un año de amor, a ver qué tanto recuerda... 💜
            </button>
        </form>

        <p id="errorMessage" class="hidden">Fecha incorrecta!<br>
            Enserio lo olvido?😢<br>
            Vuelva a intentarlo!!.</p>
    </div>

<div id="modalError" class="modal hidden">
  <div class="modal-content">
    <span class="close-button">&times;</span>
    <h2>😢 Uy, corazón no recuerda...</h2>
    <p id="modalMensaje">¿Y así me dice que me ama? 💔</p>
  </div>
</div>

    <script src="https://unpkg.com/driver.js/dist/driver.js.iife.js"></script>
    <script src="script/script.js"></script>
</body>

</html>
